# Test environments only. Never shipped.
#
# A stand-in, not a capture. Behind PHP-FPM, Apache sends a `Header append` as a Cache-Control
# line of its own after the application's; under mod_php, which wp-env runs, it is merged into
# the application's line. `Header add` makes mod_php send the two-line shape, so that
# bin/acceptance-breeze.sh can show which line comes first. It is loaded for one state of that
# run and removed again.
<IfModule mod_headers.c>
	Header add Cache-Control "s-maxage=2592000"
</IfModule>
